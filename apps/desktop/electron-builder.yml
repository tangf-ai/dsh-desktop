appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
asar: true
compression: maximum
electronDist: electron-dist
npmRebuild: false
directories:
  app: app
  output: output
files:
  - lib/types/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: .
    to: .
    filter:
      - runtime/**/*
      - legal/**/*
mac:
  category: public.app-category.developer-tools
  icon: app/assets/icon.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  minimumSystemVersion: "11.0"
  target:
    - target: dir
      arch:
        - arm64
win:
  icon: app/assets/icon.ico
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: DeepSeek-Harness-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  differentialPackage: false
