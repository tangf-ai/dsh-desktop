<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #17202a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 20px;
        padding: 32px;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 650;
        letter-spacing: 0;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 24px;
        color: #52606d;
        font-size: 14px;
        letter-spacing: 0;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #c9d2dc;
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      @media (prefers-color-scheme: dark) {
        :root { background: #15191e; color: #f2f5f7; }
        .status { color: #a9b4bf; }
        .spinner { border-color: #46515c; border-top-color: #4fa3ff; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon.svg" alt="" />
      <h1>DeepSeek Harness</h1>
      <div class="status" role="status"><span class="spinner" aria-hidden="true"></span><span>正在启动本地运行时</span></div>
    </main>
  </body>
</html>
