name: Desktop Windows distribution

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'THIRD_PARTY_NOTICES.md'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-windows:
    name: Windows x64 package
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match desktop version $version"
          }

      - name: Run desktop unit tests
        shell: pwsh
        run: pnpm --filter @deepseek-ai/dsh-desktop test

      - name: Build Windows installer
        shell: pwsh
        run: pnpm desktop:exe

      - name: Smoke packaged application
        shell: pwsh
        run: pnpm desktop:smoke:win

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64
          path: apps/desktop/release/DeepSeek-Harness-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-smoke
          path: .artifacts/desktop-windows.png
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-windows-x64
          path: dist

      - name: Create draft with Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/DeepSeek-Harness-Setup-*-x64.exe
          --draft
          --verify-tag
          --title "DSH Desktop ${GITHUB_REF_NAME#v}"
          --notes "Unsigned Windows x64 and Apple Silicon macOS desktop preview."
